name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering
    inputs:
      test_only:
        description: 'Publish to TestPyPI only'
        type: boolean
        default: false

jobs:
  # Run code quality workflow 
  quality-gate:
    name: Code Quality Assurance Gate
    uses: ./.github/workflows/code-quality.yaml


  # Run the full test suite first
  test-gate:
    name: Test Suite Gate
    uses: ./.github/workflows/test.yaml


  # Build a correctly-tagged wheel for every supported platform and Python
  # version via cibuildwheel. traffik ships a compiled C extension
  # (src/traffik/backends/_cext), so a wheel built with a plain `uv build`
  # on a single runner is only valid for that exact machine and gets tagged
  # e.g. `linux_x86_64` - not a portable manylinux/macOS/Windows tag, and
  # PyPI rejects it outright. cibuildwheel builds inside the correct
  # manylinux container (or natively on macOS/Windows) and produces wheels
  # PyPI will actually accept, for every CPython version this project
  # supports - not just whatever's on the build runner.
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: [quality-gate, test-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # manylinux x86_64
          - ubuntu-24.04-arm    # manylinux aarch64 (native runner, no QEMU)
          - macos-13            # macOS x86_64 (Intel)
          - macos-14            # macOS arm64 (Apple Silicon)
          - windows-latest      # Windows x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The source distribution is platform-independent so we build it once.
  build-sdist:
    name: Build source distribution
    needs: [quality-gate, test-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Collect every wheel and the sdist into one `dist/` artifact, named the
  # same as before (`dist-${{ github.sha }}`) so every downstream job below
  # keeps working unchanged.
  build:
    name: Collect Build Artifacts
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version consistency
        run: |
          # Extract version from pyproject.toml and git tag
          PROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [[ "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
              echo "Version mismatch: pyproject.toml has $PROJECT_VERSION but tag is $TAG_VERSION"
              exit 1
            fi
          fi
          echo "Version: $PROJECT_VERSION"

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Validate build artifacts
        run: |
          ls -la dist/
          # Verify both wheels and an sdist were produced
          test -n "$(ls dist/*.whl 2>/dev/null)" || (echo "No wheels found" && exit 1)
          test -f dist/*.tar.gz || (echo "No source distribution found" && exit 1)

          # Guard against ever shipping a wheel with a bare, non-portable
          # 'linux_*' platform tag again (only manylinux tags start with
          # 'many', so this pattern can't false-positive on a good tag).
          if ls dist/*.whl | grep -E -- '-linux_[a-z0-9_]+\.whl$'; then
            echo "Found a wheel with an unsupported bare 'linux_*' platform tag"
            exit 1
          fi

          echo "Built artifacts:"
          for f in dist/*; do echo " - $(basename "$f")"; done

          echo "✅ Build artifacts created successfully"

      - name: Verify sdist installs and compiles cleanly
        run: |
          uv venv sdist-test-env
          uv pip install dist/*.tar.gz
          uv run python -c "
          import traffik
          from traffik.backends.inmemory import InMemoryBackend
          from traffik.throttles import HTTPThrottle
          print('✅ sdist installs and compiles correctly')
          "

      - name: Upload combined build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30


  # Publish to TestPyPI for testing
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'release'
    
    environment:
      name: testpypi
      url: https://test.pypi.org/p/traffik

    outputs:
      published: ${{ steps.publish-step.outputs.published || steps.skip-step.outputs.published || 'false' }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install jq for version parsing
        run: uv pip install jq --system

      - name: Get project version
        id: get-version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on TestPyPI
        id: version-check
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if curl -sSf https://test.pypi.org/pypi/traffik/json | jq -e ".releases[\"$VERSION\"]" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publishing (version exists)
        if: steps.version-check.outputs.exists == 'true'
        run: echo "⚠️ Version already exists on TestPyPI. Skipping publish."
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Publish to TestPyPI
        id: publish-step
        if: steps.version-check.outputs.exists == 'false'
        run: |
          uv publish --index testpypi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Mark as skipped
        if: steps.version-check.outputs.exists == 'true'
        id: skip-step
        run: echo "published=false" >> "$GITHUB_OUTPUT"

  
  # Verify TestPyPI installation
  verify-testpypi:
    name: Verify TestPyPI Installation
    runs-on: ubuntu-latest
    needs: publish-testpypi
    if: needs.publish-testpypi.result == 'success' && needs.publish-testpypi.outputs.published == 'true'
    continue-on-error: true

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for TestPyPI availability
        run: |
          echo "⏳ Waiting for package to be available on TestPyPI..."
          sleep 60  # Give TestPyPI time to process

      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      traffik[all] --prefer-binary

      - name: Test installation and functionality
        run: |
          python -c "
          import asyncio
          import traffik
          from traffik.backends.inmemory import InMemoryBackend
          from traffik.throttles import HTTPThrottle
          
          print('✅ Package imported successfully')
          print(f'Version: {getattr(traffik, \"__version__\", \"unknown\")}')
          
          async def test():
              backend = InMemoryBackend()
              async with backend():
                  throttle = HTTPThrottle(uid='test', rate='60/s')
                  print('✅ Basic functionality works')
          
          asyncio.run(test())
          "


  # Publish to PyPI (production)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, publish-testpypi]
    if: >
      (github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'release' && 
      github.event.action == 'published' &&
      !github.event.release.prerelease)) &&
      (github.event.inputs.test_only != 'true' || github.event.inputs.test_only == '') &&
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.outputs.exists == 'true')
    
    environment:
      name: pypi
      url: https://pypi.org/p/traffik

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install jq for version parsing
        run: uv pip install jq --system

      - name: Get project version
        id: get-version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on PyPI
        id: version-check
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if curl -sSf https://pypi.org/pypi/traffik/json | jq -e ".releases[\"$VERSION\"]" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publishing (version exists)
        if: steps.version-check.outputs.exists == 'true'
        run: echo "⚠️ Version already exists on PyPI. Skipping publish."

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Final validation before PyPI
        if: steps.version-check.outputs.exists == 'false'
        run: |
          echo "🚀 Publishing to PyPI..."
          ls -la dist/
          
          # Double-check we're not publishing a dev version
          if uv run python -c "import tomllib; version=tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; exit(1 if 'dev' in version or 'alpha' in version or 'beta' in version or 'rc' in version else 0)"; then
            echo "✅ Version looks stable for PyPI"
          else
            echo "❌ Version appears to be a pre-release"
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.version-check.outputs.exists == 'false'
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}


  # Post-publish verification
  verify-pypi:
    name: Verify PyPI Installation
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: success()
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for PyPI availability
        run: |
          echo "⏳ Waiting for package to be available on PyPI..."
          sleep 120  # Give PyPI time to process

      - name: Install from PyPI
        run: pip install traffik[all]

      - name: Verify installation
        run: |
          python -c "
          import traffik
          print(f'✅🎉 Successfully installed traffik {getattr(traffik, \"__version__\", \"unknown\")} from PyPI')
          "
      
      - name: Create release summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published to TestPyPI" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TestPyPI installation verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Package is now available: \`pip install traffik\`" >> $GITHUB_STEP_SUMMARY
